apiVersion: v1
kind: Namespace
metadata:
  name: telemetry
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: telemetry
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cp-monitoring-prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cp-monitoring-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cp-monitoring-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: telemetry
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: telemetry
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # Per-pod / per-node CPU and working set. 2s so short install-time peaks
      # aren't averaged away; drop to 15s for long-lived deployments.
      - job_name: kubernetes-cadvisor
        scheme: https
        scrape_interval: 2s
        metrics_path: /metrics/cadvisor
        kubernetes_sd_configs:
          - role: node
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true   # kubelet serving certs are often self-signed
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      # Kubelet's own /metrics via the apiserver proxy (running pods, volume stats).
      - job_name: kubernetes-nodes-kubelet
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics
          - source_labels: [__meta_kubernetes_node_name]
            action: replace
            target_label: kubernetes_node
        # Drop the most expensive kubelet histograms; counters and gauges are kept.
        metric_relabel_configs:
          - source_labels: [__name__]
            action: drop
            regex: '(rest_client_request_duration_seconds|kubelet_runtime_operations_duration_seconds|storage_operation_duration_seconds|kubelet_pod_start_duration_seconds|kubelet_pod_worker_duration_seconds|kubelet_cgroup_manager_duration_seconds)_bucket'

      # Apiserver metrics (RSS, request rates by verb, apiserver_storage_objects).
      - job_name: kubernetes-apiservers
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https
        # Drop the very high-cardinality apiserver histograms.
        metric_relabel_configs:
          - source_labels: [__name__]
            action: drop
            regex: '(apiserver_request_duration_seconds|apiserver_response_sizes|apiserver_request_filter_duration_seconds|apiserver_request_sli_duration_seconds|etcd_request_duration_seconds|rest_client_request_duration_seconds|workqueue_queue_duration_seconds|workqueue_work_duration_seconds)_bucket'

      # etcd server metrics (WAL fsync p99, DB size), the sizing-harness health gate.
      # kubeadm: discovers etcd static pods; stays DOWN unless etcd's
      # --listen-metrics-urls includes a node-reachable address.
      - job_name: kubernetes-etcd
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - kube-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_component]
            action: keep
            regex: etcd
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            replacement: $1:2381
          - source_labels: [__meta_kubernetes_pod_node_name]
            action: replace
            target_label: instance
          - source_labels: [__meta_kubernetes_pod_node_name]
            action: replace
            target_label: kubernetes_node

      # k0s variant: etcd is a host process, not a pod. Replace the job above
      # with this one, filling in controller IPs, and set in the k0s config:
      #   spec.etcd.extraArgs:
      #     listen-metrics-urls: http://0.0.0.0:2381
      # - job_name: kubernetes-etcd
      #   static_configs:
      #     - targets:
      #         - <controller-1-ip>:2381
      #         - <controller-2-ip>:2381
      #         - <controller-3-ip>:2381
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: telemetry
  labels:
    app: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate   # single replica; avoids RWO PVC deadlock if you switch to a PVC
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --web.enable-lifecycle   # POST /-/reload after a ConfigMap change
          ports:
            - containerPort: 9090
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        # Throwaway storage: fine for validation clusters, lost on pod restart.
        # For durable data swap in a PVC (keep strategy: Recreate above).
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: telemetry
  labels:
    app: prometheus
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      nodePort: 32090
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: telemetry
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
              name: grafana-port
          resources:
            limits:
              memory: "2Gi"
              cpu: "1000m"
            requests:
              memory: "256Mi"
              cpu: "100m"
          volumeMounts:
            - mountPath: /var/lib/grafana
              name: grafana-storage
      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: telemetry
spec:
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 32000
  selector:
    app: grafana
  type: NodePort
